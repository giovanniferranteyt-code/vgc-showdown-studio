name: Update VGC Meta Data

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Meta Sync Job
        run: |
          python sync_job.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vgc_meta.db data/pokedex.json data/moves.json data/items.json data/learnsets.json data/formats-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update VGC & Showdown meta database [skip ci]" && git push)
